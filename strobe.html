<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strobe Stimulus Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #eee;
        }
        #stimulusCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #interface-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            width: 340px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        #interface-container.collapsed #controls-form {
            display: none;
        }
        #interface-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            user-select: none;
        }
        #interface-header h3 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        #toggle-btn {
            background: none;
            border: none;
            color: #eee;
            font-size: 12px;
            cursor: pointer;
        }
        #controls-form {
            padding: 16px;
        }
        .control-group {
            margin-bottom: 14px;
        }
        .control-group:last-child {
            margin-bottom: 0;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            color: #aaa;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
        input[type="number"], input[type="color"], select {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        input[type="color"] {
            height: 32px;
            padding: 2px;
            cursor: pointer;
        }
        input[type="checkbox"] {
            margin-right: 6px;
            vertical-align: middle;
        }
        .checkbox-label {
            display: inline-block;
            color: #eee;
            font-size: 13px;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
            margin-bottom: 0;
        }
        .btn-stack {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        button.action-btn {
            flex: 1;
            padding: 8px;
            border-radius: 4px;
            border: none;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #playPauseBtn {
            background: #007acc;
            color: white;
        }
        #shareBtn {
            background: #333;
            color: #eee;
            border: 1px solid #444;
        }
        #shareBtn:hover { background: #444; }
        #playPauseBtn:hover { background: #008ae6; }
        
        /* Utility class to completely hide UI for view-only links */
        .invisible {
            display: none !important;
        }
    </style>
</head>
<body>

    <canvas id="stimulusCanvas"></canvas>

    <div id="interface-container">
        <div id="interface-header" id="panelHeader">
            <h3>Strobe Controls</h3>
            <button id="toggle-btn">Collapse</button>
        </div>
        <form id="controls-form">
            <div class="control-group">
                <div class="row">
                    <div>
                        <label for="c1">Colour 1</label>
                        <input type="color" id="c1" value="#000000">
                    </div>
                    <div>
                        <label for="c2">Colour 2</label>
                        <input type="color" id="c2" value="#ffffff">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <div class="row">
                    <div>
                        <label for="freq">Frequency (Hz)</label>
                        <input type="number" id="freq" value="7" step="0.1" min="0.1" max="60">
                    </div>
                    <div>
                        <label for="duty">Duty Cycle (%)</label>
                        <input type="number" id="duty" value="50" step="1" min="1" max="99">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Static Noise Colour 1</label>
                <div class="row">
                    <div>
                        <input type="checkbox" id="ns1"><label for="ns1" class="checkbox-label">Enable</label>
                    </div>
                </div>
                <div class="row" style="margin-top: 8px;">
                    <div>
                        <label for="na1">Amp (0-1)</label>
                        <input type="number" id="na1" value="0.2" step="0.05" min="0" max="1">
                    </div>
                    <div>
                        <label for="nf1">Res (Px Size)</label>
                        <input type="number" id="nf1" value="4" step="1" min="1" max="20">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Static Noise Colour 2</label>
                <div class="row">
                    <div>
                        <input type="checkbox" id="ns2"><label for="ns2" class="checkbox-label">Enable</label>
                    </div>
                </div>
                <div class="row" style="margin-top: 8px;">
                    <div>
                        <label for="na2">Amp (0-1)</label>
                        <input type="number" id="na2" value="0.2" step="0.05" min="0" max="1">
                    </div>
                    <div>
                        <label for="nf2">Res (Px Size)</label>
                        <input type="number" id="nf2" value="4" step="1" min="1" max="20">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label>Fixation Cross</label>
                <div class="row">
                    <div style="flex: 0.5; display: flex; align-items: center;">
                        <input type="checkbox" id="fc"><label for="fc" class="checkbox-label">On</label>
                    </div>
                    <div>
                        <input type="color" id="fcc" value="#ff0000">
                    </div>
                    <div>
                        <input type="number" id="fcs" value="15" min="5" max="100" placeholder="Size">
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="len">Stimulus Length (s, 0=Inf)</label>
                <input type="number" id="len" value="0" step="1" min="0">
            </div>

            <div class="btn-stack">
                <button type="button" id="playPauseBtn" class="action-btn">Pause</button>
                <button type="button" id="shareBtn" class="action-btn">Copy Link</button>
            </div>
        </form>
    </div>

    <script>
        // --- State Management ---
        const state = {
            c1: '#000000',
            c2: '#ffffff',
            freq: 7,
            duty: 50,
            ns1: false,
            na1: 0.2,
            nf1: 4,
            ns2: false,
            na2: 0.2,
            nf2: 4,
            fc: false,
            fcc: '#ff0000',
            fcs: 15,
            ui: 'expanded', // 'expanded', 'collapsed', 'invisible'
            len: 0,
            playing: true
        };

        // --- DOM Elements ---
        const canvas = document.getElementById('stimulusCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiContainer = document.getElementById('interface-container');
        const uiHeader = document.getElementById('interface-header');
        const toggleBtn = document.getElementById('toggle-btn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const shareBtn = document.getElementById('shareBtn');
        const form = document.getElementById('controls-form');

        // --- Noise Caching System ---
        // Pre-allocating offscreen canvases to store noise patterns, avoiding per-frame pixel generation math.
        const noiseCanvas1 = document.createElement('canvas');
        const noiseCtx1 = noiseCanvas1.getContext('2d');
        const noiseCanvas2 = document.createElement('canvas');
        const noiseCtx2 = noiseCanvas2.getContext('2d');

        let lastPhase = -1; // Tracks state switches to trigger noise regeneration
        let startTime = null;
        let animationFrameId = null;

        // --- URL Parameter Synchronization ---
        function loadUrlParameters() {
            const params = new URLSearchParams(window.location.search);
            
            if (params.has('c1')) state.c1 = '#' + params.get('c1');
            if (params.has('c2')) state.c2 = '#' + params.get('c2');
            if (params.has('freq')) state.freq = parseFloat(params.get('freq'));
            if (params.has('duty')) state.duty = parseInt(params.get('duty'), 10);
            
            if (params.has('ns1')) state.ns1 = params.get('ns1') === '1';
            if (params.has('na1')) state.na1 = parseFloat(params.get('na1'));
            if (params.has('nf1')) state.nf1 = parseInt(params.get('nf1'), 10);
            
            if (params.has('ns2')) state.ns2 = params.get('ns2') === '1';
            if (params.has('na2')) state.na2 = parseFloat(params.get('na2'));
            if (params.has('nf2')) state.nf2 = parseInt(params.get('nf2'), 10);
            
            if (params.has('fc')) state.fc = params.get('fc') === '1';
            if (params.has('fcc')) state.fcc = '#' + params.get('fcc');
            if (params.has('fcs')) state.fcs = parseInt(params.get('fcs'), 10);
            
            if (params.has('ui')) state.ui = params.get('ui');
            if (params.has('len')) state.len = parseInt(params.get('len'), 10);
            if (params.has('playing')) state.playing = params.get('playing') === '1';

            updateUiFromState();
        }

        function generateShareUrl(viewOnly = false) {
            const params = new URLSearchParams();
            params.set('c1', state.c1.replace('#', ''));
            params.set('c2', state.c2.replace('#', ''));
            params.set('freq', state.freq);
            params.set('duty', state.duty);
            if (state.ns1) {
                params.set('ns1', '1');
                params.set('na1', state.na1);
                params.set('nf1', state.nf1);
            }
            if (state.ns2) {
                params.set('ns2', '1');
                params.set('na2', state.na2);
                params.set('nf2', state.nf2);
            }
            if (state.fc) {
                params.set('fc', '1');
                params.set('fcc', state.fcc.replace('#', ''));
                params.set('fcs', state.fcs);
            }
            
            if (viewOnly) {
                params.set('ui', 'invisible');
                params.set('playing', '1');
                params.set('len', state.len > 0 ? state.len : 10); // Default to 10s if view-only is generated without duration
            } else {
                params.set('ui', state.ui);
                params.set('playing', state.playing ? '1' : '0');
                params.set('len', state.len);
            }

            return `${window.location.origin}${window.location.pathname}?${params.toString()}`;
        }

        // --- UI Sync ---
        function updateUiFromState() {
            document.getElementById('c1').value = state.c1;
            document.getElementById('c2').value = state.c2;
            document.getElementById('freq').value = state.freq;
            document.getElementById('duty').value = state.duty;
            document.getElementById('ns1').checked = state.ns1;
            document.getElementById('na1').value = state.na1;
            document.getElementById('nf1').value = state.nf1;
            document.getElementById('ns2').checked = state.ns2;
            document.getElementById('na2').value = state.na2;
            document.getElementById('nf2').value = state.nf2;
            document.getElementById('fc').checked = state.fc;
            document.getElementById('fcc').value = state.fcc;
            document.getElementById('fcs').value = state.fcs;
            document.getElementById('len').value = state.len;

            playPauseBtn.textContent = state.playing ? 'Pause' : 'Play';

            // Apply UI Visibility rules
            uiContainer.classList.remove('collapsed', 'invisible');
            if (state.ui === 'collapsed') {
                uiContainer.classList.add('collapsed');
                toggleBtn.textContent = 'Expand';
            } else if (state.ui === 'invisible') {
                uiContainer.classList.add('invisible');
            } else {
                toggleBtn.textContent = 'Collapse';
            }
        }

        function updateStateFromUi() {
            state.c1 = document.getElementById('c1').value;
            state.c2 = document.getElementById('c2').value;
            state.freq = parseFloat(document.getElementById('freq').value) || 7;
            state.duty = parseInt(document.getElementById('duty').value, 10) || 50;
            state.ns1 = document.getElementById('ns1').checked;
            state.na1 = parseFloat(document.getElementById('na1').value) || 0;
            state.nf1 = parseInt(document.getElementById('nf1').value, 10) || 1;
            state.ns2 = document.getElementById('ns2').checked;
            state.na2 = parseFloat(document.getElementById('na2').value) || 0;
            state.nf2 = parseInt(document.getElementById('nf2').value, 10) || 1;
            state.fc = document.getElementById('fc').checked;
            state.fcc = document.getElementById('fcc').value;
            state.fcs = parseInt(document.getElementById('fcs').value, 10) || 15;
            state.len = parseInt(document.getElementById('len').value, 10) || 0;
        }

        // --- Canvas & Generation Mechanics ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            noiseCanvas1.width = canvas.width;
            noiseCanvas1.height = canvas.height;
            noiseCanvas2.width = canvas.width;
            noiseCanvas2.height = canvas.height;
            lastPhase = -1; // Clear phase forcing cached noise to match new window constraints
        }

        function generateCachedNoise(targetCanvas, targetCtx, baseColorHex, noiseAmp, pixelSize) {
            const w = targetCanvas.width;
            const h = targetCanvas.height;
            
            // Draw background primary color
            targetCtx.fillStyle = baseColorHex;
            targetCtx.fillRect(0, 0, w, h);

            if (noiseAmp <= 0) return;

            // Parse hex to RGB values
            const rBase = parseInt(baseColorHex.slice(1, 3), 16);
            const gBase = parseInt(baseColorHex.slice(3, 5), 16);
            const bBase = parseInt(baseColorHex.slice(5, 7), 16);

            // Render random static noise blocks safely mapping deviations to performance boundary constraints
            for (let x = 0; x < w; x += pixelSize) {
                for (let y = 0; y < h; y += pixelSize) {
                    const noiseFactor = (Math.random() - 0.5) * 2 * noiseAmp; // Range: [-amp, amp]
                    
                    const r = Math.min(255, Math.max(0, rBase + noiseFactor * 255));
                    const g = Math.min(255, Math.max(0, gBase + noiseFactor * 255));
                    const b = Math.min(255, Math.max(0, bBase + noiseFactor * 255));

                    targetCtx.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
                    targetCtx.fillRect(x, y, pixelSize, pixelSize);
                }
            }
        }

        function drawFixationCross() {
            if (!state.fc) return;
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const size = state.fcs;

            ctx.strokeStyle = state.fcc;
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Horizontal
            ctx.moveTo(cx - size, cy);
            ctx.lineTo(cx + size, cy);
            // Vertical
            ctx.moveTo(cx, cy - size);
            ctx.lineTo(cx, cy + size);
            ctx.stroke();
        }

        // --- Core Loop Execution ---
        function loop(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsedSeconds = (timestamp - startTime) / 1000;

            // Handle strict redirect rules for expired view-only contexts
            if (state.len > 0 && elapsedSeconds >= state.len) {
                cancelAnimationFrame(animationFrameId);
                window.location.href = window.location.origin; // Redirect back to baseline domain index
                return;
            }

            if (state.playing) {
                const period = 1 / state.freq;
                const timeInPeriod = elapsedSeconds % period;
                const dutyBoundary = (state.duty / 100) * period;

                // Determine active cycle phase (0 = Colour 1, 1 = Colour 2)
                const currentPhase = (timeInPeriod < dutyBoundary) ? 0 : 1;

                // Refresh unique cached noise matrix exactly once per hard flash trigger boundaries
                if (currentPhase !== lastPhase) {
                    if (currentPhase === 0) {
                        if (state.ns1) {
                            generateCachedNoise(noiseCanvas1, noiseCtx1, state.c1, state.na1, state.nf1);
                            ctx.drawImage(noiseCanvas1, 0, 0);
                        } else {
                            ctx.fillStyle = state.c1;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                    } else {
                        if (state.ns2) {
                            generateCachedNoise(noiseCanvas2, noiseCtx2, state.c2, state.na2, state.nf2);
                            ctx.drawImage(noiseCanvas2, 0, 0);
                        } else {
                            ctx.fillStyle = state.c2;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                    }
                    lastPhase = currentPhase;
                    drawFixationCross();
                }
            } else {
                // If paused, maintain visualization without state updates using current parameters
                ctx.fillStyle = state.c1;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawFixationCross();
                lastPhase = -1; 
            }

            animationFrameId = requestAnimationFrame(loop);
        }

        // --- Interactive Event Infrastructure ---
        uiHeader.addEventListener('click', () => {
            if (state.ui === 'invisible') return;
            state.ui = (state.ui === 'expanded') ? 'collapsed' : 'expanded';
            updateUiFromState();
        });

        // Prevent control interactions inside form from closing structural window component
        form.addEventListener('click', (e) => e.stopPropagation());

        form.addEventListener('input', () => {
            updateStateFromUi();
            lastPhase = -1; // Terminate cache boundaries to execute runtime changes safely
        });

        playPauseBtn.addEventListener('click', () => {
            state.playing = !state.playing;
            playPauseBtn.textContent = state.playing ? 'Pause' : 'Play';
        });

        shareBtn.addEventListener('click', () => {
            // Determine structure layout requirements depending on length profile selection
            const isViewOnly = state.len > 0;
            const link = generateShareUrl(isViewOnly);
            
            navigator.clipboard.writeText(link).then(() => {
                const origText = shareBtn.textContent;
                shareBtn.textContent = 'Copied!';
                setTimeout(() => shareBtn.textContent = origText, 1500);
            }).catch(err => {
                console.error('Could not copy string link execution context: ', err);
            });
        });

        // Global hotkey support for control operations inside alternative VR configurations
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') { // Spacebar toggles engine execution
                e.preventDefault();
                playPauseBtn.click();
            }
            if (e.key === 'h' || e.key === 'H') { // 'H' Completely displays/hides configuration stack
                state.ui = (state.ui === 'invisible') ? 'expanded' : 'invisible';
                updateUiFromState();
            }
        });

        window.addEventListener('resize', resizeCanvas);

        // --- Core Application Execution Start ---
        loadUrlParameters();
        resizeCanvas();
        animationFrameId = requestAnimationFrame(loop);
    </script>
</body>
</html>
